<!DOCTYPE html>
<html lang="{{ page.lang | default: site.lang | default: "ko" }}">
  <head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">

{% seo %}
    <link rel="stylesheet" href="{{ "/assets/css/style.css?v=" | append: site.github.build_revision | relative_url }}">
    {% include head-custom.html %}
    <style id="github-octocat-badge-style">
.github-octocat-badge{position:fixed;right:1.25rem;bottom:1.25rem;z-index:2147483000;display:inline-flex;align-items:center;gap:.5rem;padding:.55rem .85rem;border-radius:999px;background:#181717;color:#fff;font:600 13px/1 -apple-system,BlinkMacSystemFont,"Segoe UI","Apple SD Gothic Neo","Malgun Gothic",sans-serif;letter-spacing:.01em;text-decoration:none;box-shadow:0 6px 20px rgba(0,0,0,.22);transition:background-color .15s ease,transform .15s ease}
.github-octocat-badge:hover{background:#2b2b2b;transform:translateY(-1px)}
.github-octocat-badge:focus-visible{outline:2px solid #fff;outline-offset:2px}
.github-octocat-badge svg{display:block;flex:none}
@media (max-width:600px){.github-octocat-badge{right:.75rem;bottom:.75rem;padding:.6rem;gap:0}.github-octocat-badge span{position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}}
    </style>
  </head>
  <body>
    <div class="container-lg px-3 my-5 markdown-body">
      {% if site.title and site.title != page.title %}
      <h1><a href="{{ "/" | absolute_url }}">{{ site.title }}</a></h1>
      {% endif %}

      {{ content }}

      {% if site.github.private != true and site.github.license %}
      <div class="footer border-top border-gray-light mt-5 pt-3 text-right text-gray">
        This site is open source. {% github_edit_link "Improve this page" %}.
      </div>
      {% endif %}
    </div>
    <a class="github-octocat-badge" href="https://github.com/hslcrb/frontend-lecture_hslcrb" target="_blank" rel="noopener noreferrer" aria-label="GitHub 저장소 열기 (새 탭)"><svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor" aria-hidden="true" focusable="false"><path d="M10.226 17.284c-2.965-.36-5.054-2.493-5.054-5.256 0-1.123.404-2.336 1.078-3.144-.292-.741-.247-2.314.09-2.965.898-.112 2.111.36 2.83 1.01.853-.269 1.752-.404 2.853-.404 1.1 0 1.999.135 2.807.382.696-.629 1.932-1.1 2.83-.988.315.606.36 2.179.067 2.942.72.854 1.101 2 1.101 3.167 0 2.763-2.089 4.852-5.098 5.234.763.494 1.28 1.572 1.28 2.807v2.336c0 .674.561 1.056 1.235.786 4.066-1.55 7.255-5.615 7.255-10.646C23.5 6.188 18.334 1 11.978 1 5.62 1 .5 6.188.5 12.545c0 4.986 3.167 9.12 7.435 10.669.606.225 1.19-.18 1.19-.786V20.63a2.9 2.9 0 0 1-1.078.224c-1.483 0-2.359-.808-2.987-2.313-.247-.607-.517-.966-1.034-1.033-.27-.023-.359-.135-.359-.27 0-.27.45-.471.898-.471.652 0 1.213.404 1.797 1.235.45.651.921.943 1.483.943.561 0 .92-.202 1.437-.719.382-.381.674-.718.944-.943"/></svg><span>GitHub</span></a>

    <script>anchors.add();</script>
  </body>
</html>
