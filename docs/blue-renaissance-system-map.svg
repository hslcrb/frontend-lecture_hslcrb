<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1700 1080" role="img" aria-labelledby="diagramTitle diagramDesc">
<title id="diagramTitle">Blue Renaissance × Frontend Lab — 시스템 전체 관계도</title>
<desc id="diagramDesc">사용자는 Cloudflare Access Google 인증을 거쳐 React 앱을 이용한다. 모든 동적 요청은 Workers에서 권한을 확인하고 D1에서 강의, 퀴즈, 학생, 성적, 권한 데이터를 읽고 쓴다. GitHub main에서 Workers Builds로 자동 배포하며 과거 정적 원본은 별도 보존 브랜치에만 남긴다.</desc>
