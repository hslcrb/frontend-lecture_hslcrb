  <marker id="arrsoft" viewBox="0 0 10 10" markerWidth="8" markerHeight="8" refX="8" refY="5" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#8b9bb5" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
  <filter id="shadow" x="-15%" y="-30%" width="130%" height="160%"><feDropShadow dx="0" dy="6" stdDeviation="11" flood-color="#233b74" flood-opacity=".065"/></filter>
